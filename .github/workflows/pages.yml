# Build the game and publish it to GitHub Pages.
#
# The built site is deliberately not committed: it is generated from source on
# every push, so what is published can never drift from what is in the repo.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; a queued one supersedes the one before it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not the single commit checkout gives by
          # default. `tests/ui/news.test.ts` checks every news entry against
          # the days work actually landed on, and one commit makes every
          # entry older than the last push look invented.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Assemble the site
        run: |
          mkdir -p _site/play
          cp docs/index.html _site/index.html
          cp -R dist/. _site/play/
          # Stops Pages running the built output through Jekyll.
          touch _site/.nojekyll
          echo "built $(du -sh _site/play | cut -f1) of game"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
