# Typecheck, test and build every push and pull request, so a broken build is
# caught before it reaches the Pages deployment.
name: CI

on:
  push:
    branches-ignore: [main] # main is covered by the Pages workflow
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not the single commit checkout gives by
          # default. `tests/ui/news.test.ts` checks every news entry against
          # the days work actually landed on, and one commit makes every
          # entry older than the last push look invented.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
